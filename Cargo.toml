[package]
name = "armature-proc-macro"
version = "0.4.1"
edition = "2024"
rust-version = "1.94.1"
authors = ["Joseph Quinn <quinn.josephr@proton.me>"]
license = "Apache-2.0"
repository = "https://github.com/quinnjr/armature-proc-macro"
homepage = "https://quinnjr.github.io/armature"
description = "Procedural macros for Armature framework"
keywords = ["proc-macro", "framework", "routes", "controllers"]
categories = ["development-tools::procedural-macro-helpers"]

[lib]
proc-macro = true

[dependencies]
syn = { version = "3.0", features = ["full", "extra-traits"] }
quote = "1.0"
proc-macro2 = "1.0"

[dev-dependencies]
cargo-husky = { version = "1.5", default-features = false, features = ["user-hooks"] }
armature-core = { version = "0.10" }
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_urlencoded = "0.7"
tokio = { version = "1.53", features = ["rt", "rt-multi-thread", "macros", "time"] }
tracing = "0.1"
trybuild = "1"

