[package]
name = "armature-proc-macro"
version = "0.3.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository = "https://github.com/quinnjr/armature-proc-macro"
homepage.workspace = true
description = "Procedural macros for Armature framework"
keywords = ["proc-macro", "framework", "routes", "controllers"]
categories = ["development-tools::procedural-macro-helpers"]

[lib]
proc-macro = true

[dependencies]
syn = { version = "2.0", features = ["full", "extra-traits"] }
quote = "1.0"
proc-macro2 = "1.0"

[dev-dependencies]
cargo-husky = { version = "1.5", default-features = false, features = ["user-hooks"] }
armature-core = { path = "../armature-core" }
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_urlencoded = "0.7"
tokio = { version = "1.52", features = ["rt", "rt-multi-thread", "macros", "time"] }
tracing = "0.1"
trybuild = "1"

